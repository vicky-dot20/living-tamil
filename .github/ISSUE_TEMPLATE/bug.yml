name: Bug report
description: Report a reproducible problem in the application.
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Do not include credentials or private information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. See…"
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Page or route
      placeholder: /kural
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, device, operating system, branch, and commit if known.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue.
          required: true
        - label: This is not a security vulnerability.
          required: true
